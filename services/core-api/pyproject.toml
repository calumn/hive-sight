[project]
name = "hive-sight-core-api"
version = "0.1.0"
description = "Product-facing Core API for HiveSight."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pillow>=10.0,<12.0",
  "psycopg[binary]>=3.2,<4.0",
  "uvicorn[standard]>=0.32,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "pytest-bdd>=8.0,<9.0",
  "ruff>=0.8,<1.0"
]
grounding-dino = [
  "torch>=2.3,<3.0",
  "torchvision>=0.18,<1.0",
  "transformers>=4.50,<6.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hive_sight_core_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
