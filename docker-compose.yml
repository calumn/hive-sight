services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hive_sight
      POSTGRES_PASSWORD: hive_sight
      POSTGRES_DB: hive_sight_core
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive_sight"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hive_sight
      MINIO_ROOT_PASSWORD: hive-sight-local-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:

